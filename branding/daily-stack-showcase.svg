<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 290" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="stack-bg" cx="50%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#243328"/>
      <stop offset="70%" stop-color="#1b291f"/>
      <stop offset="100%" stop-color="#121d15"/>
    </radialGradient>

    <!-- Card Background -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#283d2e"/>
      <stop offset="100%" stop-color="#1c2b20"/>
    </linearGradient>

    <style>
        0%, 100% { opacity: 0.9; transform: scale(1); }
        50% { opacity: 0.35; transform: scale(0.8); }
      }
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -32; }
      }
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-3px); }
      }

      .font-sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
      .font-mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
      
      .pulse-dot {
      }
      .anim-dash {
        stroke-dasharray: 8 4;
        
      }
      .card-1 {  }
      .card-2 {  }
      .card-3 {  }
    </style>
  </defs>

  <!-- Main Container with Ample Padding -->
  <rect width="920" height="290" rx="18" fill="url(#stack-bg)" stroke="#344e41" stroke-width="1.5"/>

  <!-- Header Section with Clear Spacing -->
  <g transform="translate(36, 20)">
    <text class="font-mono" font-size="11.5" font-weight="700" fill="#a3c9a8" letter-spacing="2">
      ENGINEERING ECOSYSTEM // CORE DISCIPLINES
    </text>
    <text y="26" class="font-sans" font-size="17" font-weight="700" fill="#f4f1de">
      Modern Web Craftsmanship: Clean Architecture &amp; Fluid Interfaces
    </text>
    <line x1="0" y1="42" x2="850" y2="42" stroke="#2d4233" stroke-width="1.2"/>
  </g>

  <!-- Three Columns Cards (Horizontal Layout with Clear Spacing) -->
  
  <!-- Column 1: Client &amp; Interface -->
  <g transform="translate(36, 72)">
    <rect width="264" height="190" rx="13" fill="url(#card-grad)" stroke="#3d5a44" stroke-width="1.3"/>
    <rect width="264" height="190" rx="13" fill="none" stroke="#a3c9a8" stroke-width="1.2" opacity="0.7"/>
    
    <!-- Top Pill -->
    <rect x="16" y="14" width="232" height="28" rx="8" fill="#1b291f" stroke="#4a6b52" stroke-width="1"/>
    <circle cx="30" cy="28" r="4.5" fill="#a3c9a8"/>
    <text x="42" y="33" class="font-mono" font-size="11" font-weight="800" fill="#c7efcf">CLIENT &amp; UI DESIGN</text>

    <!-- Content -->
    <g transform="translate(16, 58)" class="font-sans">
      <text y="0" font-size="12.5" font-weight="700" fill="#f4f1de">React &amp; Next.js</text>
      <text y="18" class="font-mono" font-size="10.5" fill="#a3c9a8">TypeScript, Vite, Tailwind</text>
      
      <text y="48" font-size="12.5" font-weight="700" fill="#f4f1de">UI Design Systems</text>
      <text y="66" class="font-mono" font-size="10.5" fill="#a3c9a8">Figma, Accessibility, UX</text>

      <!-- Bottom Badge -->
      <rect x="0" y="90" width="232" height="22" rx="6" fill="#17241b" stroke="#2d4233" stroke-width="0.8"/>
      <text x="116" y="107" class="font-mono" font-size="10" fill="#c7efcf" text-anchor="middle" font-weight="600">Responsive &amp; Accessible</text>
    </g>
  </g>

  <!-- Column 2: Backend &amp; Logic -->
  <g transform="translate(328, 72)">
    <rect width="264" height="190" rx="13" fill="url(#card-grad)" stroke="#3d5a44" stroke-width="1.3"/>
    <rect width="264" height="190" rx="13" fill="none" stroke="#f7d6c8" stroke-width="1.2" opacity="0.7"/>
    
    <!-- Top Pill -->
    <rect x="16" y="14" width="232" height="28" rx="8" fill="#1b291f" stroke="#4a6b52" stroke-width="1"/>
    <circle cx="30" cy="28" r="4.5" fill="#f7d6c8"/>
    <text x="42" y="33" class="font-mono" font-size="11" font-weight="800" fill="#f7d6c8">BACKEND &amp; LOGIC</text>

    <!-- Content -->
    <g transform="translate(16, 58)" class="font-sans">
      <text y="0" font-size="12.5" font-weight="700" fill="#f4f1de">Laravel &amp; PHP</text>
      <text y="18" class="font-mono" font-size="10.5" fill="#f7d6c8">REST APIs, Eloquent, Blade</text>
      
      <text y="48" font-size="12.5" font-weight="700" fill="#f4f1de">Python Microservices</text>
      <text y="66" class="font-mono" font-size="10.5" fill="#f7d6c8">FastAPI, Scripting, Automation</text>

      <!-- Bottom Badge -->
      <rect x="0" y="90" width="232" height="22" rx="6" fill="#17241b" stroke="#2d4233" stroke-width="0.8"/>
      <text x="116" y="107" class="font-mono" font-size="10" fill="#f7d6c8" text-anchor="middle" font-weight="600">Clean Architecture &amp; Quality</text>
    </g>
  </g>

  <!-- Column 3: Data &amp; Infrastructure -->
  <g transform="translate(620, 72)">
    <rect width="264" height="190" rx="13" fill="url(#card-grad)" stroke="#3d5a44" stroke-width="1.3"/>
    <rect width="264" height="190" rx="13" fill="none" stroke="#ffeaa7" stroke-width="1.2" opacity="0.7"/>
    
    <!-- Top Pill -->
    <rect x="16" y="14" width="232" height="28" rx="8" fill="#1b291f" stroke="#4a6b52" stroke-width="1"/>
    <circle cx="30" cy="28" r="4.5" fill="#ffeaa7"/>
    <text x="42" y="33" class="font-mono" font-size="11" font-weight="800" fill="#ffeaa7">DATA &amp; INFRASTRUCTURE</text>

    <!-- Content -->
    <g transform="translate(16, 58)" class="font-sans">
      <text y="0" font-size="12.5" font-weight="700" fill="#f4f1de">Persistence &amp; Storage</text>
      <text y="18" class="font-mono" font-size="10.5" fill="#ffeaa7">PostgreSQL, MySQL, Redis</text>
      
      <text y="48" font-size="12.5" font-weight="700" fill="#f4f1de">Workflow &amp; DevOps</text>
      <text y="66" class="font-mono" font-size="10.5" fill="#ffeaa7">Docker, Linux, Git, Neovim</text>

      <!-- Bottom Badge -->
      <rect x="0" y="90" width="232" height="22" rx="6" fill="#17241b" stroke="#2d4233" stroke-width="0.8"/>
      <text x="116" y="107" class="font-mono" font-size="10" fill="#ffeaa7" text-anchor="middle" font-weight="600">Reliable &amp; Repeatable</text>
    </g>
  </g>
</svg>