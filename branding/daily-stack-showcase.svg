<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 270" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="stack-bg" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#243328"/>
      <stop offset="70%" stop-color="#1b291f"/>
      <stop offset="100%" stop-color="#131e16"/>
    </radialGradient>

    <!-- Card Background -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#283d2e"/>
      <stop offset="100%" stop-color="#1f2f23"/>
    </linearGradient>

    <style>
      @keyframes soft-pulse-dot {
        0%, 100% { opacity: 0.9; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.85); }
      }
      .font-sans {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      }
      .font-mono {
        font-family: 'JetBrains Mono', 'Fira Code', monospace;
      }
      .pulse-dot {
        animation: soft-pulse-dot 2.5s ease-in-out infinite;
        transform-origin: center;
      }
    </style>
  </defs>

  <!-- Container -->
  <rect width="880" height="270" rx="16" fill="url(#stack-bg)" stroke="#344e41" stroke-width="1.4"/>

  <!-- Header Title -->
  <g transform="translate(32, 28)">
    <text class="font-mono" font-size="11" font-weight="700" fill="#a3c9a8" letter-spacing="2">
      ENGINEERING ECOSYSTEM // CORE DISCIPLINES
    </text>
    <text y="22" class="font-sans" font-size="16" font-weight="700" fill="#f4f1de">
      Crafting Modern Web Solutions from Concept to Deployment
    </text>
    <line x1="0" y1="34" x2="816" y2="34" stroke="#2d4233" stroke-width="1"/>
  </g>

  <!-- Three Columns Cards -->
  <!-- Column 1: Client & Interface -->
  <g transform="translate(32, 78)">
    <rect width="258" height="166" rx="12" fill="url(#card-grad)" stroke="#3d5a44" stroke-width="1"/>
    
    <!-- Top Pill -->
    <rect x="16" y="14" width="226" height="26" rx="7" fill="#1b291f" stroke="#4a6b52" stroke-width="0.8"/>
    <circle cx="28" cy="27" r="4" fill="#a3c9a8" class="pulse-dot"/>
    <text x="38" y="31" class="font-mono" font-size="10.5" font-weight="700" fill="#c7efcf">CLIENT &amp; UI DESIGN</text>

    <!-- Content Items -->
    <g transform="translate(16, 54)" class="font-sans">
      <text y="14" font-size="12" font-weight="600" fill="#f4f1de">React &amp; Next.js Ecosystem</text>
      <text y="30" class="font-mono" font-size="10" fill="#a3c9a8">TypeScript, JavaScript, Vite</text>
      
      <text y="54" font-size="12" font-weight="600" fill="#f4f1de">Design &amp; Styling Systems</text>
      <text y="70" class="font-mono" font-size="10" fill="#a3c9a8">Tailwind CSS, Figma UI/UX</text>

      <!-- Bottom Status -->
      <rect x="0" y="86" width="226" height="18" rx="5" fill="#17241b"/>
      <text x="113" y="99" class="font-mono" font-size="9" fill="#c7efcf" text-anchor="middle">Focus: Responsive &amp; Accessible</text>
    </g>
  </g>

  <!-- Column 2: Backend & Server -->
  <g transform="translate(311, 78)">
    <rect width="258" height="166" rx="12" fill="url(#card-grad)" stroke="#3d5a44" stroke-width="1"/>
    
    <!-- Top Pill -->
    <rect x="16" y="14" width="226" height="26" rx="7" fill="#1b291f" stroke="#4a6b52" stroke-width="0.8"/>
    <circle cx="28" cy="27" r="4" fill="#f7d6c8" class="pulse-dot"/>
    <text x="38" y="31" class="font-mono" font-size="10.5" font-weight="700" fill="#f7d6c8">BACKEND &amp; LOGIC</text>

    <!-- Content Items -->
    <g transform="translate(16, 54)" class="font-sans">
      <text y="14" font-size="12" font-weight="600" fill="#f4f1de">Laravel &amp; Modern PHP</text>
      <text y="30" class="font-mono" font-size="10" fill="#f7d6c8">REST APIs, Blade, Eloquent</text>
      
      <text y="54" font-size="12" font-weight="600" fill="#f4f1de">Python &amp; API Microservices</text>
      <text y="70" class="font-mono" font-size="10" fill="#f7d6c8">FastAPI, Automation, Scripting</text>

      <!-- Bottom Status -->
      <rect x="0" y="86" width="226" height="18" rx="5" fill="#17241b"/>
      <text x="113" y="99" class="font-mono" font-size="9" fill="#f7d6c8" text-anchor="middle">Focus: Clean Architecture &amp; Data Integrity</text>
    </g>
  </g>

  <!-- Column 3: Data & Infrastructure -->
  <g transform="translate(590, 78)">
    <rect width="258" height="166" rx="12" fill="url(#card-grad)" stroke="#3d5a44" stroke-width="1"/>
    
    <!-- Top Pill -->
    <rect x="16" y="14" width="226" height="26" rx="7" fill="#1b291f" stroke="#4a6b52" stroke-width="0.8"/>
    <circle cx="28" cy="27" r="4" fill="#ffeaa7" class="pulse-dot"/>
    <text x="38" y="31" class="font-mono" font-size="10.5" font-weight="700" fill="#ffeaa7">DATA &amp; ENVIRONMENT</text>

    <!-- Content Items -->
    <g transform="translate(16, 54)" class="font-sans">
      <text y="14" font-size="12" font-weight="600" fill="#f4f1de">Persistence &amp; Storage</text>
      <text y="30" class="font-mono" font-size="10" fill="#ffeaa7">PostgreSQL, MySQL, Redis</text>
      
      <text y="54" font-size="12" font-weight="600" fill="#f4f1de">Workflow &amp; Operations</text>
      <text y="70" class="font-mono" font-size="10" fill="#ffeaa7">Docker, Linux, Git, Neovim</text>

      <!-- Bottom Status -->
      <rect x="0" y="86" width="226" height="18" rx="5" fill="#17241b"/>
      <text x="113" y="99" class="font-mono" font-size="9" fill="#ffeaa7" text-anchor="middle">Focus: Reliable &amp; Repeatable Dev</text>
    </g>
  </g>
</svg>