<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 290" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="stack-bg" cx="50%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#243328"/>
      <stop offset="70%" stop-color="#1b291f"/>
      <stop offset="100%" stop-color="#121d15"/>
    </radialGradient>

    <!-- Card Background -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#283d2e"/>
      <stop offset="100%" stop-color="#1c2b20"/>
    </linearGradient>

    <style>
      .font-sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
      .font-mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    </style>
  </defs>

  <!-- Main Container -->
  <rect width="1100" height="290" rx="18" fill="url(#stack-bg)" stroke="#344e41" stroke-width="1.5"/>

  <!-- Header Section -->
  <g transform="translate(40, 20)">
    <text class="font-mono" font-size="11.5" font-weight="700" fill="#a3c9a8" letter-spacing="2">
      ENGINEERING ECOSYSTEM // CORE DISCIPLINES
    </text>
    <text y="26" class="font-sans" font-size="17" font-weight="700" fill="#f4f1de">
      Modern Web Craftsmanship: Clean Architecture &amp; Fluid Interfaces
    </text>
    <line x1="0" y1="42" x2="1020" y2="42" stroke="#2d4233" stroke-width="1.2"/>
  </g>

  <!-- Column 1: Client UI -->
  <g transform="translate(40, 72)">
    <rect width="330" height="190" rx="13" fill="url(#card-grad)" stroke="#a3c9a8" stroke-width="1.5"/>
    
    <rect x="18" y="14" width="294" height="28" rx="8" fill="#1b291f" stroke="#4a6b52" stroke-width="1"/>
    <circle cx="32" cy="28" r="4.5" fill="#a3c9a8"/>
    <text x="44" y="33" class="font-mono" font-size="11" font-weight="800" fill="#c7efcf">CLIENT &amp; UI DESIGN</text>

    <g transform="translate(18, 58)" class="font-sans">
      <text y="0" font-size="12.5" font-weight="700" fill="#f4f1de">React &amp; Next.js</text>
      <text y="18" class="font-mono" font-size="10.5" fill="#a3c9a8">TypeScript, Vite, Tailwind</text>
      
      <text y="48" font-size="12.5" font-weight="700" fill="#f4f1de">UI Design Systems</text>
      <text y="66" class="font-mono" font-size="10.5" fill="#a3c9a8">Figma, Accessibility, UX</text>

      <rect x="0" y="90" width="294" height="22" rx="6" fill="#17241b" stroke="#2d4233" stroke-width="0.8"/>
      <text x="147" y="107" class="font-mono" font-size="10" fill="#c7efcf" text-anchor="middle" font-weight="600">Responsive &amp; Accessible</text>
    </g>
  </g>

  <!-- Column 2: Backend -->
  <g transform="translate(385, 72)">
    <rect width="330" height="190" rx="13" fill="url(#card-grad)" stroke="#f7d6c8" stroke-width="1.5"/>
    
    <rect x="18" y="14" width="294" height="28" rx="8" fill="#1b291f" stroke="#4a6b52" stroke-width="1"/>
    <circle cx="32" cy="28" r="4.5" fill="#f7d6c8"/>
    <text x="44" y="33" class="font-mono" font-size="11" font-weight="800" fill="#f7d6c8">BACKEND &amp; LOGIC</text>

    <g transform="translate(18, 58)" class="font-sans">
      <text y="0" font-size="12.5" font-weight="700" fill="#f4f1de">Laravel &amp; PHP</text>
      <text y="18" class="font-mono" font-size="10.5" fill="#f7d6c8">REST APIs, Eloquent, Blade</text>
      
      <text y="48" font-size="12.5" font-weight="700" fill="#f4f1de">Python Microservices</text>
      <text y="66" class="font-mono" font-size="10.5" fill="#f7d6c8">FastAPI, Scripting, Automation</text>

      <rect x="0" y="90" width="294" height="22" rx="6" fill="#17241b" stroke="#2d4233" stroke-width="0.8"/>
      <text x="147" y="107" class="font-mono" font-size="10" fill="#f7d6c8" text-anchor="middle" font-weight="600">Clean Architecture &amp; Quality</text>
    </g>
  </g>

  <!-- Column 3: Data Infrastructure -->
  <g transform="translate(730, 72)">
    <rect width="330" height="190" rx="13" fill="url(#card-grad)" stroke="#ffeaa7" stroke-width="1.5"/>
    
    <rect x="18" y="14" width="294" height="28" rx="8" fill="#1b291f" stroke="#4a6b52" stroke-width="1"/>
    <circle cx="32" cy="28" r="4.5" fill="#ffeaa7"/>
    <text x="44" y="33" class="font-mono" font-size="11" font-weight="800" fill="#ffeaa7">DATA &amp; INFRASTRUCTURE</text>

    <g transform="translate(18, 58)" class="font-sans">
      <text y="0" font-size="12.5" font-weight="700" fill="#f4f1de">Persistence &amp; Storage</text>
      <text y="18" class="font-mono" font-size="10.5" fill="#ffeaa7">PostgreSQL, MySQL, Redis</text>
      
      <text y="48" font-size="12.5" font-weight="700" fill="#f4f1de">Workflow &amp; DevOps</text>
      <text y="66" class="font-mono" font-size="10.5" fill="#ffeaa7">Docker, Linux, Git, Neovim</text>

      <rect x="0" y="90" width="294" height="22" rx="6" fill="#17241b" stroke="#2d4233" stroke-width="0.8"/>
      <text x="147" y="107" class="font-mono" font-size="10" fill="#ffeaa7" text-anchor="middle" font-weight="600">Reliable &amp; Repeatable</text>
    </g>
  </g>
</svg>