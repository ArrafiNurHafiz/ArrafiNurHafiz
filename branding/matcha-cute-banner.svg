<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="matcha-night" cx="50%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#283d2e"/>
      <stop offset="60%" stop-color="#1b291f"/>
      <stop offset="100%" stop-color="#121d15"/>
    </radialGradient>

    <!-- Animated Border Gradient -->
    <linearGradient id="flow-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a3c9a8">
        <animate attributeName="stop-color" values="#a3c9a8;#c7efcf;#f7d6c8;#ffeaa7;#a3c9a8" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#c7efcf">
        <animate attributeName="stop-color" values="#c7efcf;#f7d6c8;#ffeaa7;#a3c9a8;#c7efcf" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#7fa073">
        <animate attributeName="stop-color" values="#7fa073;#a3c9a8;#c7efcf;#f7d6c8;#7fa073" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Soft Ambient Shadow -->
    <filter id="soft-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0b130e" flood-opacity="0.55"/>
    </filter>

    <style>
      /* --- CONTINUOUS MOVEMENT ANIMATIONS --- */
      @keyframes steam-drift-1 {
        0% { transform: translate(0, 0) scale(0.8); opacity: 0; }
        30% { opacity: 0.9; }
        100% { transform: translate(-8px, -24px) scale(1.4); opacity: 0; }
      }
      @keyframes steam-drift-2 {
        0% { transform: translate(0, 0) scale(0.7); opacity: 0; }
        40% { opacity: 0.85; }
        100% { transform: translate(8px, -28px) scale(1.5); opacity: 0; }
      }
      @keyframes steam-drift-3 {
        0% { transform: translate(0, 0) scale(0.9); opacity: 0; }
        50% { opacity: 0.95; }
        100% { transform: translate(-4px, -32px) scale(1.6); opacity: 0; }
      }

      @keyframes cloud-drift-left {
        0% { transform: translateX(200px); }
        100% { transform: translateX(-120px); }
      }
      @keyframes cloud-drift-slow {
        0% { transform: translateX(180px); }
        100% { transform: translateX(-140px); }
      }

      @keyframes leaf-sway {
        0%, 100% { transform: rotate(0deg); }
        25% { transform: rotate(3deg); }
        75% { transform: rotate(-3deg); }
      }

      @keyframes spin-twinkle {
        0% { transform: rotate(0deg) scale(0.7); opacity: 0.3; }
        50% { transform: rotate(180deg) scale(1.25); opacity: 1; }
        100% { transform: rotate(360deg) scale(0.7); opacity: 0.3; }
      }

      @keyframes lofi-bar-1 { 0%, 100% { height: 6px; } 50% { height: 20px; } }
      @keyframes lofi-bar-2 { 0%, 100% { height: 18px; } 50% { height: 8px; } }
      @keyframes lofi-bar-3 { 0%, 100% { height: 10px; } 50% { height: 24px; } }
      @keyframes lofi-bar-4 { 0%, 100% { height: 22px; } 50% { height: 6px; } }
      @keyframes lofi-bar-5 { 0%, 100% { height: 14px; } 50% { height: 22px; } }
      @keyframes lofi-bar-6 { 0%, 100% { height: 8px; } 50% { height: 16px; } }

      @keyframes dash-marquee {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -40; }
      }

      @keyframes pulse-ring {
        0% { r: 4px; opacity: 1; }
        100% { r: 12px; opacity: 0; }
      }

      @keyframes typing-line-1 {
        0%, 10% { opacity: 0; }
        20%, 100% { opacity: 1; }
      }
      @keyframes typing-line-2 {
        0%, 30% { opacity: 0; }
        40%, 100% { opacity: 1; }
      }
      @keyframes typing-line-3 {
        0%, 50% { opacity: 0; }
        60%, 100% { opacity: 1; }
      }

      @keyframes blink-cursor {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }

      @keyframes float-subtle {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }

      .text-sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      .text-mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
      
      .s1 { animation: steam-drift-1 2.4s ease-in-out infinite; }
      .s2 { animation: steam-drift-2 2.8s ease-in-out infinite 0.8s; }
      .s3 { animation: steam-drift-3 3.2s ease-in-out infinite 1.6s; }

      .cloud1 { animation: cloud-drift-left 16s linear infinite; }
      .cloud2 { animation: cloud-drift-slow 22s linear infinite 5s; }

      .plant-sway {
        transform-origin: 298px 260px;
        animation: leaf-sway 4s ease-in-out infinite;
      }

      .twinkle-star1 {
        transform-origin: 150px 70px;
        animation: spin-twinkle 4s linear infinite;
      }
      .twinkle-star2 {
        transform-origin: 80px 50px;
        animation: spin-twinkle 3.2s linear infinite 1s;
      }
      .twinkle-star3 {
        transform-origin: 220px 42px;
        animation: spin-twinkle 5s linear infinite 2s;
      }

      .marquee-border {
        stroke-dasharray: 10 6;
        animation: dash-marquee 2.5s linear infinite;
      }

      .pulse-beacon {
        animation: pulse-ring 2s cubic-bezier(0.2, 0.8, 0.4, 1) infinite;
      }

      .bar1 { animation: lofi-bar-1 1.2s ease-in-out infinite; }
      .bar2 { animation: lofi-bar-2 0.9s ease-in-out infinite; }
      .bar3 { animation: lofi-bar-3 1.4s ease-in-out infinite; }
      .bar4 { animation: lofi-bar-4 1.1s ease-in-out infinite; }
      .bar5 { animation: lofi-bar-5 1.3s ease-in-out infinite; }
      .bar6 { animation: lofi-bar-6 0.8s ease-in-out infinite; }

      .t-line1 { animation: typing-line-1 5s infinite; }
      .t-line2 { animation: typing-line-2 5s infinite; }
      .t-line3 { animation: typing-line-3 5s infinite; }
      .cursor { animation: blink-cursor 0.9s step-start infinite; }

      .floating-card { animation: float-subtle 4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- ==================== BACKGROUND ==================== -->
  <rect width="920" height="450" rx="22" fill="url(#matcha-night)" stroke="url(#flow-border)" stroke-width="2"/>

  <!-- ==================== TOP WINDOW HEADER BAR ==================== -->
  <g transform="translate(24, 16)">
    <rect width="872" height="38" rx="12" fill="#1b291f" stroke="#2d4233" stroke-width="1.2"/>
    
    <!-- Pastel Soft Dots -->
    <circle cx="20" cy="19" r="6" fill="#f7d6c8"/>
    <circle cx="38" cy="19" r="6" fill="#ffeaa7"/>
    <circle cx="56" cy="19" r="6" fill="#a3c9a8"/>

    <!-- Center Window Title with Live Radar Beacon -->
    <g transform="translate(360, 19)">
      <circle cx="-16" cy="0" r="4" fill="#a3c9a8"/>
      <circle cx="-16" cy="0" r="4" fill="none" stroke="#a3c9a8" stroke-width="1.5" class="pulse-beacon"/>
      <text x="0" y="4" class="text-mono" font-size="12" font-weight="600" fill="#a3c9a8" letter-spacing="1">
        workspace :: arrafi.dev (online)
      </text>
    </g>

    <!-- Right Lo-Fi Music Player Pill with Animated Equalizer Bars -->
    <g transform="translate(718, 7)">
      <rect width="140" height="24" rx="8" fill="#243328" stroke="#3d5a44" stroke-width="0.8"/>
      
      <!-- Mini Equalizer Bars -->
      <g transform="translate(14, 20)">
        <rect x="0" y="-12" width="3" height="12" rx="1.5" fill="#a3c9a8" class="bar1"/>
        <rect x="5" y="-16" width="3" height="16" rx="1.5" fill="#c7efcf" class="bar2"/>
        <rect x="10" y="-10" width="3" height="10" rx="1.5" fill="#f7d6c8" class="bar3"/>
        <rect x="15" y="-14" width="3" height="14" rx="1.5" fill="#ffeaa7" class="bar4"/>
        <rect x="20" y="-8" width="3" height="8" rx="1.5" fill="#a3c9a8" class="bar5"/>
        <rect x="25" y="-12" width="3" height="12" rx="1.5" fill="#c7efcf" class="bar6"/>
      </g>
      
      <text x="48" y="16" class="text-mono" font-size="9.5" font-weight="700" fill="#f4f1de">
        LO-FI CODING
      </text>
    </g>
  </g>

  <!-- ==================== LEFT CARD: COZY WORKSPACE & DESK ==================== -->
  <g transform="translate(24, 70)" filter="url(#soft-shadow)">
    <!-- Main Card Body -->
    <rect width="364" height="354" rx="18" fill="#1b291f" stroke="#344e41" stroke-width="1.5"/>

    <!-- Inner Window View (Drawn SVG with Moving Clouds) -->
    <g transform="translate(22, 22)">
      <rect width="186" height="136" rx="14" fill="#223126" stroke="#3d5a44" stroke-width="1.2"/>
      
      <!-- Overflow Clip for Window -->
      <clipPath id="window-clip">
        <rect width="186" height="136" rx="14"/>
      </clipPath>
      
      <g clip-path="url(#window-clip)">
        <!-- Hills in Distance -->
        <path d="M -10,95 Q 60,65 140,88 Q 180,98 200,95 L 200,140 L -10,140 Z" fill="#2d3f32"/>
        <path d="M -10,110 Q 70,85 150,110 L 200,105 L 200,140 L -10,140 Z" fill="#384f3e"/>
        
        <!-- Glowing Crescent Moon -->
        <path d="M 145,26 A 14,14 0 1 0 153,48 A 11,11 0 1 1 145,26 Z" fill="#ffeaa7"/>

        <!-- Animated Floating Clouds -->
        <g class="cloud1" fill="#f4f1de" opacity="0.6">
          <path d="M 0,48 Q 12,36 26,42 Q 38,32 50,40 Q 58,50 46,55 L 4,55 Z"/>
        </g>
        <g class="cloud2" fill="#e9edc9" opacity="0.45">
          <path d="M 0,28 Q 10,18 22,24 Q 32,16 42,22 Q 48,30 38,34 L 4,34 Z"/>
        </g>

        <!-- Animated Twinkling Stars -->
        <g class="twinkle-star1">
          <path d="M 150,70 L 151,72 L 153,73 L 151,74 L 150,76 L 149,74 L 147,73 L 149,72 Z" fill="#c7efcf"/>
        </g>
        <g class="twinkle-star2">
          <path d="M 80,50 L 81,52 L 83,53 L 81,54 L 80,56 L 79,54 L 77,53 L 79,52 Z" fill="#ffeaa7"/>
        </g>
        <g class="twinkle-star3">
          <path d="M 220,42 L 221,44 L 223,45 L 221,46 L 220,48 L 219,46 L 217,45 L 219,44 Z" fill="#f7d6c8"/>
        </g>
      </g>
    </g>

    <!-- Wall Shelf with Little Pastel Books -->
    <g transform="translate(226, 32)">
      <rect x="0" y="44" width="114" height="6" rx="3" fill="#3d5a44"/>
      <rect x="12" y="16" width="12" height="28" rx="2" fill="#7fa073"/>
      <rect x="28" y="10" width="14" height="34" rx="2" fill="#f4f1de"/>
      <rect x="46" y="20" width="10" height="24" rx="2" fill="#f7d6c8"/>
      <!-- Small Hanging Vine Plant on Shelf -->
      <path d="M 80,32 L 96,32 L 92,44 L 84,44 Z" fill="#e9edc9"/>
      <ellipse cx="88" cy="28" rx="8" ry="5" fill="#a3c9a8"/>
      <path d="M 88,44 Q 92,54 86,62" fill="none" stroke="#7fa073" stroke-width="1.5"/>
    </g>

    <!-- Desk Table Surface -->
    <rect x="16" y="286" width="332" height="10" rx="3" fill="#384f3e"/>
    <rect x="36" y="296" width="8" height="44" rx="3" fill="#2d3f32"/>
    <rect x="320" y="296" width="8" height="44" rx="3" fill="#2d3f32"/>

    <!-- Animated Laptop with Flowing Code -->
    <g transform="translate(68, 190)">
      <rect width="138" height="92" rx="8" fill="#121d15" stroke="url(#flow-border)" stroke-width="1.5"/>
      <rect x="6" y="6" width="126" height="80" rx="5" fill="#1b291f"/>
      
      <!-- Code lines with sequential typing animations -->
      <g class="text-mono" font-size="8.5">
        <text x="12" y="22" fill="#a3c9a8" class="t-line1">const arrafi = {</text>
        <text x="18" y="36" fill="#f4f1de" class="t-line2">  focus: "Full-Stack",</text>
        <text x="18" y="50" fill="#ffeaa7" class="t-line3">  stack: "Next + Laravel",</text>
        <text x="12" y="66" fill="#c7efcf">};<tspan fill="#a3c9a8" class="cursor"> _</tspan></text>
      </g>
      
      <!-- Laptop Base -->
      <path d="M -12,92 L 150,92 L 144,98 L -6,98 Z" fill="#283d2e"/>
    </g>

    <!-- Steaming Hot Matcha Mug with 3 Animated Steam Trails -->
    <g transform="translate(228, 234)">
      <!-- Ceramic Cup Body -->
      <path d="M 6,18 L 34,18 L 30,48 L 10,48 Z" fill="#f4f1de" stroke="#7fa073" stroke-width="1.2"/>
      <path d="M 32,24 Q 44,24 44,34 Q 44,42 30,42" fill="none" stroke="#f4f1de" stroke-width="2.5"/>
      <ellipse cx="20" cy="18" rx="14" ry="4.5" fill="#a3c9a8"/>
      <ellipse cx="20" cy="18" rx="10" ry="3" fill="#7fa073"/>
      
      <!-- Animated Floating Steam Particles -->
      <path d="M 16,12 Q 12,2 17,-8 Q 12,-16 16,-24" fill="none" stroke="#f4f1de" stroke-width="1.6" stroke-linecap="round" class="s1"/>
      <path d="M 22,12 Q 28,4 21,-6 Q 26,-14 21,-26" fill="none" stroke="#e9edc9" stroke-width="1.4" stroke-linecap="round" class="s2"/>
      <path d="M 27,14 Q 30,6 26,-2 Q 30,-10 27,-22" fill="none" stroke="#c7efcf" stroke-width="1.2" stroke-linecap="round" class="s3"/>
    </g>

    <!-- Swaying Succulent Plant on Desk -->
    <g class="plant-sway">
      <g transform="translate(286, 222)">
        <path d="M 6,24 L 30,24 L 27,48 L 9,48 Z" fill="#f7d6c8"/>
        <rect x="4" y="20" width="28" height="5" rx="2" fill="#eed2c4"/>
        <path d="M 18,20 Q 8,8 10,0 Q 18,4 18,20 Z" fill="#7fa073"/>
        <path d="M 18,20 Q 28,8 26,0 Q 18,4 18,20 Z" fill="#a3c9a8"/>
        <path d="M 18,20 Q 18,6 20,2 Q 22,10 18,20 Z" fill="#c7efcf"/>
      </g>
    </g>
  </g>

  <!-- ==================== RIGHT PANEL: PROFILE & INTERACTIVE CARDS ==================== -->
  <g transform="translate(408, 70)" filter="url(#soft-shadow)">
    <!-- Container Card with Animated Marquee Border -->
    <rect width="488" height="354" rx="18" fill="#1b291f" stroke="#344e41" stroke-width="1.5"/>
    <rect width="488" height="354" rx="18" fill="none" stroke="#a3c9a8" stroke-width="1.5" opacity="0.6" class="marquee-border"/>

    <!-- Greeting Header -->
    <g transform="translate(32, 34)">
      <text class="text-mono" font-size="11.5" font-weight="700" fill="#a3c9a8" letter-spacing="1.5">
        FULL-STACK DEVELOPER &amp; EXPLORER
      </text>
      
      <text y="38" class="text-sans" font-size="30" font-weight="800" fill="#f4f1de">
        Arrafi Nur Hafiz
      </text>

      <text y="64" class="text-sans" font-size="14.5" font-weight="500" fill="#c7efcf">
        Undergraduate Information Systems Student // UTDI
      </text>

      <line x1="0" y1="80" x2="424" y2="80" stroke="#2d4233" stroke-width="1.2"/>
    </g>

    <!-- Information Badges Grid -->
    <g transform="translate(32, 134)" class="text-sans">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="204" height="44" rx="10" fill="#243328" stroke="#3d5a44" stroke-width="1"/>
        <circle cx="18" cy="22" r="4.5" fill="#a3c9a8"/>
        <text x="32" y="18" class="text-mono" font-size="9" font-weight="700" fill="#a3c9a8">PRIMARY DISCIPLINE</text>
        <text x="32" y="33" font-size="12" font-weight="600" fill="#f4f1de">Web &amp; Software Eng.</text>
      </g>

      <!-- Pill 2 -->
      <g transform="translate(220, 0)">
        <rect width="204" height="44" rx="10" fill="#243328" stroke="#3d5a44" stroke-width="1"/>
        <circle cx="18" cy="22" r="4.5" fill="#f7d6c8"/>
        <text x="32" y="18" class="text-mono" font-size="9" font-weight="700" fill="#f7d6c8">DAILY STACK</text>
        <text x="32" y="33" font-size="12" font-weight="600" fill="#f4f1de">Next.js, React, Laravel</text>
      </g>

      <!-- Pill 3 -->
      <g transform="translate(0, 56)">
        <rect width="204" height="44" rx="10" fill="#243328" stroke="#3d5a44" stroke-width="1"/>
        <circle cx="18" cy="22" r="4.5" fill="#ffeaa7"/>
        <text x="32" y="18" class="text-mono" font-size="9" font-weight="700" fill="#ffeaa7">CURRENT ACTIVITY</text>
        <text x="32" y="33" font-size="12" font-weight="600" fill="#f4f1de">Intern @ CV KWaS</text>
      </g>

      <!-- Pill 4 -->
      <g transform="translate(220, 56)">
        <rect width="204" height="44" rx="10" fill="#243328" stroke="#3d5a44" stroke-width="1"/>
        <circle cx="18" cy="22" r="4.5" fill="#c7efcf"/>
        <text x="32" y="18" class="text-mono" font-size="9" font-weight="700" fill="#c7efcf">CORE VALUE</text>
        <text x="32" y="33" font-size="12" font-weight="600" fill="#f4f1de">Amal Jariyah (Charity)</text>
      </g>
    </g>

    <!-- Live Activity Wave & Philosophy Box -->
    <g transform="translate(32, 256)">
      <rect width="424" height="70" rx="12" fill="#16221a" stroke="#2d4233" stroke-width="1"/>
      
      <g transform="translate(18, 20)">
        <text class="text-mono" font-size="10.5" font-weight="700" fill="#a3c9a8">
          ACTIVE STATUS // PASSIONATE CRAFTSMANSHIP
        </text>
        <text y="20" class="text-sans" font-size="12" font-weight="500" fill="#f4f1de">
          Writing maintainable code, designing clean UI, and learning daily.
        </text>
        <text y="38" class="text-mono" font-size="10" fill="#ffeaa7">
          Uptime: Continuous Learning // Refresh Rate: High Energy
        </text>
      </g>
    </g>
  </g>
</svg>