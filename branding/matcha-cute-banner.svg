<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Deep Matcha Night) -->
    <radialGradient id="matcha-bg" cx="50%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#283d2e"/>
      <stop offset="60%" stop-color="#1b291f"/>
      <stop offset="100%" stop-color="#131e16"/>
    </radialGradient>

    <!-- Soft Cream Glassmorphic Gradient -->
    <linearGradient id="cream-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4f1de" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#a3c9a8" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Warm Matcha Accent Border Gradient -->
    <linearGradient id="matcha-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a3c9a8"/>
      <stop offset="50%" stop-color="#c7efcf"/>
      <stop offset="100%" stop-color="#7fa073"/>
    </linearGradient>

    <!-- Soft Ambient Shadow -->
    <filter id="soft-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0b130e" flood-opacity="0.5"/>
    </filter>

    <style>
      @keyframes steam-rise {
        0% { transform: translateY(0px) scaleX(1); opacity: 0.8; }
        50% { transform: translateY(-8px) scaleX(1.2); opacity: 0.4; }
        100% { transform: translateY(-16px) scaleX(1.4); opacity: 0; }
      }
      @keyframes float-cloud {
        0%, 100% { transform: translateX(0px); }
        50% { transform: translateX(8px); }
      }
      @keyframes pulse-plant {
        0%, 100% { transform: rotate(0deg); }
        25% { transform: rotate(1.5deg); }
        75% { transform: rotate(-1.5deg); }
      }
      @keyframes star-twinkle {
        0%, 100% { opacity: 0.3; transform: scale(0.85); }
        50% { opacity: 1; transform: scale(1.15); }
      }
      @keyframes blink-cursor {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes breath-pill {
        0%, 100% { opacity: 0.85; }
        50% { opacity: 1; }
      }

      .text-sans {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .text-mono {
        font-family: 'JetBrains Mono', 'Fira Code', monospace;
      }
      .steam-1 {
        animation: steam-rise 2.8s ease-in-out infinite;
      }
      .steam-2 {
        animation: steam-rise 2.8s ease-in-out infinite 1.4s;
      }
      .cloud-anim {
        animation: float-cloud 8s ease-in-out infinite;
      }
      .plant-anim {
        transform-origin: bottom center;
        animation: pulse-plant 6s ease-in-out infinite;
      }
      .twinkle-1 {
        transform-origin: center;
        animation: star-twinkle 3s ease-in-out infinite;
      }
      .twinkle-2 {
        transform-origin: center;
        animation: star-twinkle 3s ease-in-out infinite 1.5s;
      }
      .cursor-blink {
        animation: blink-cursor 1s step-start infinite;
      }
    </style>
  </defs>

  <!-- ==================== MAIN CARD BACKGROUND ==================== -->
  <rect width="920" height="440" rx="20" fill="url(#matcha-bg)" stroke="#344e41" stroke-width="1.5"/>

  <!-- ==================== TOP WINDOW BAR ==================== -->
  <g transform="translate(24, 16)">
    <rect width="872" height="36" rx="12" fill="#1b291f" stroke="#2d4233" stroke-width="1"/>
    
    <!-- Pastel Soft Dots -->
    <circle cx="20" cy="18" r="6" fill="#f7d6c8"/>
    <circle cx="38" cy="18" r="6" fill="#ffeaa7"/>
    <circle cx="56" cy="18" r="6" fill="#a3c9a8"/>

    <!-- Center Window Title -->
    <text x="436" y="22" class="text-mono" font-size="12" font-weight="600" fill="#a3c9a8" text-anchor="middle" letter-spacing="1">
      workspace :: arrafi.dev — cozy matcha studio
    </text>

    <!-- Right Badge -->
    <rect x="760" y="8" width="96" height="20" rx="6" fill="#283d2e" stroke="#3d5a44" stroke-width="0.8"/>
    <text x="808" y="22" class="text-mono" font-size="10" font-weight="600" fill="#c7efcf" text-anchor="middle">
      status: online
    </text>
  </g>

  <!-- ==================== LEFT ILLUSTRATION: COZY DESK SETUP ==================== -->
  <g transform="translate(24, 68)" filter="url(#soft-shadow)">
    <!-- Illustration Backdrop Container -->
    <rect width="360" height="346" rx="16" fill="#1b291f" stroke="#2d4233" stroke-width="1.2"/>

    <!-- Cute Window (Pastel Sky) -->
    <g transform="translate(24, 24)">
      <rect width="180" height="130" rx="14" fill="#243328" stroke="#3d5a44" stroke-width="1.2"/>
      
      <!-- Night / Dawn Gradient inside Window -->
      <path d="M 0,90 Q 90,60 180,90 L 180,130 L 0,130 Z" fill="#2f4335"/>
      <path d="M 0,105 Q 90,85 180,110 L 180,130 L 0,130 Z" fill="#3a5342"/>
      
      <!-- Soft Crescent Moon (Drawn SVG) -->
      <path d="M 140,28 A 14,14 0 1 0 148,50 A 11,11 0 1 1 140,28 Z" fill="#ffeaa7" opacity="0.9"/>

      <!-- Soft Pastel Clouds (Drawn SVG) -->
      <g class="cloud-anim" opacity="0.75" fill="#f4f1de">
        <path d="M 24,52 Q 32,42 42,48 Q 50,40 60,46 Q 66,54 58,58 L 26,58 Z"/>
      </g>
      
      <!-- Sparkle Stars -->
      <g class="twinkle-1" transform="translate(90, 36)">
        <path d="M 0,-4 L 1,-1 L 4,0 L 1,1 L 0,4 L -1,1 L -4,0 L -1,-1 Z" fill="#c7efcf"/>
      </g>
      <g class="twinkle-2" transform="translate(48, 26)">
        <path d="M 0,-3 L 1,-1 L 3,0 L 1,1 L 0,3 L -1,1 L -3,0 L -1,-1 Z" fill="#ffeaa7"/>
      </g>
    </g>

    <!-- Wall Shelf with Little Books -->
    <g transform="translate(220, 32)">
      <rect x="0" y="40" width="116" height="6" rx="3" fill="#3d5a44"/>
      <!-- Book 1 (Matcha) -->
      <rect x="12" y="14" width="12" height="26" rx="2" fill="#7fa073"/>
      <!-- Book 2 (Cream) -->
      <rect x="27" y="10" width="14" height="30" rx="2" fill="#f4f1de"/>
      <!-- Book 3 (Peach) -->
      <rect x="44" y="18" width="10" height="22" rx="2" fill="#f7d6c8"/>
      <!-- Little Plant Pot on Shelf -->
      <path d="M 76,28 L 94,28 L 90,40 L 80,40 Z" fill="#e9edc9"/>
      <ellipse cx="85" cy="24" rx="8" ry="5" fill="#a3c9a8"/>
    </g>

    <!-- Cute Desk Table Top -->
    <path d="M 16,280 L 344,280 L 344,290 L 16,290 Z" fill="#3d5a44" rx="2"/>
    <rect x="36" y="290" width="8" height="42" rx="3" fill="#2d4233"/>
    <rect x="316" y="290" width="8" height="42" rx="3" fill="#2d4233"/>

    <!-- Cozy Laptop on Desk -->
    <g transform="translate(70, 186)">
      <!-- Laptop Screen -->
      <rect width="134" height="88" rx="8" fill="#131e16" stroke="#4a6b52" stroke-width="1.4"/>
      <!-- Screen Inner -->
      <rect x="6" y="6" width="122" height="76" rx="4" fill="#1b291f"/>
      
      <!-- Mini Code Lines on Screen -->
      <text x="12" y="20" class="text-mono" font-size="8" fill="#a3c9a8">const arrafi = {</text>
      <text x="18" y="32" class="text-mono" font-size="8" fill="#f4f1de">  role: "Full-Stack",</text>
      <text x="18" y="44" class="text-mono" font-size="8" fill="#ffeaa7">  focus: "Web Dev",</text>
      <text x="18" y="56" class="text-mono" font-size="8" fill="#c7efcf">  craft: "Clean Code"</text>
      <text x="12" y="68" class="text-mono" font-size="8" fill="#a3c9a8">};<tspan fill="#c7efcf" class="cursor-blink">_</tspan></text>
      
      <!-- Laptop Base -->
      <path d="M -10,88 L 144,88 L 138,94 L -4,94 Z" fill="#2d4233"/>
    </g>

    <!-- Steaming Matcha Latte Cup -->
    <g transform="translate(224, 230)">
      <!-- Cup Body -->
      <path d="M 6,18 L 34,18 L 30,48 L 10,48 Z" fill="#f4f1de" stroke="#7fa073" stroke-width="1.2"/>
      <!-- Cup Handle -->
      <path d="M 32,24 Q 44,24 44,34 Q 44,42 30,42" fill="none" stroke="#f4f1de" stroke-width="2.5"/>
      <!-- Matcha Foam Top -->
      <ellipse cx="20" cy="18" rx="14" ry="4" fill="#a3c9a8"/>
      <ellipse cx="20" cy="18" rx="10" ry="2.5" fill="#7fa073"/>
      
      <!-- Animated Steam (Drawn Paths) -->
      <path d="M 16,12 Q 13,4 17,-2" fill="none" stroke="#f4f1de" stroke-width="1.5" stroke-linecap="round" class="steam-1"/>
      <path d="M 24,12 Q 28,4 23,-3" fill="none" stroke="#f4f1de" stroke-width="1.5" stroke-linecap="round" class="steam-2"/>
    </g>

    <!-- Potted Plant on Desk (Botanical) -->
    <g transform="translate(282, 218)" class="plant-anim">
      <!-- Terracotta/Cream Pot -->
      <path d="M 6,24 L 30,24 L 27,48 L 9,48 Z" fill="#f7d6c8"/>
      <rect x="4" y="20" width="28" height="5" rx="2" fill="#eed2c4"/>
      <!-- Green Leaves -->
      <path d="M 18,20 Q 8,8 10,0 Q 18,4 18,20 Z" fill="#7fa073"/>
      <path d="M 18,20 Q 28,8 26,0 Q 18,4 18,20 Z" fill="#a3c9a8"/>
      <path d="M 18,20 Q 18,6 20,2 Q 22,10 18,20 Z" fill="#c7efcf"/>
    </g>
  </g>

  <!-- ==================== RIGHT PANEL: PROFILE & TECH PILLS ==================== -->
  <g transform="translate(404, 68)" filter="url(#soft-shadow)">
    <!-- Right Container Card -->
    <rect width="492" height="346" rx="16" fill="#1b291f" stroke="#2d4233" stroke-width="1.2"/>

    <!-- Greeting & Identity Header -->
    <g transform="translate(32, 34)">
      <text class="text-mono" font-size="12" font-weight="600" fill="#a3c9a8" letter-spacing="1">
        WELCOME TO MY REPOSITORY
      </text>
      
      <text y="36" class="text-sans" font-size="28" font-weight="800" fill="#f4f1de">
        Arrafi Nur Hafiz
      </text>

      <text y="60" class="text-sans" font-size="14" font-weight="500" fill="#c7efcf">
        Full-Stack Web Developer &amp; Information Systems Student
      </text>

      <line x1="0" y1="76" x2="428" y2="76" stroke="#2d4233" stroke-width="1.2"/>
    </g>

    <!-- Cute Soft Information Pills Grid -->
    <g transform="translate(32, 130)" class="text-sans">
      <!-- Pill 1: Core Focus -->
      <g transform="translate(0, 0)">
        <rect width="206" height="42" rx="10" fill="#243328" stroke="#3d5a44" stroke-width="1"/>
        <circle cx="18" cy="21" r="4.5" fill="#a3c9a8"/>
        <text x="32" y="18" class="text-mono" font-size="9.5" font-weight="700" fill="#a3c9a8">PRIMARY FOCUS</text>
        <text x="32" y="32" font-size="11.5" font-weight="600" fill="#f4f1de">Full-Stack Web Engineering</text>
      </g>

      <!-- Pill 2: Main Stack -->
      <g transform="translate(222, 0)">
        <rect width="206" height="42" rx="10" fill="#243328" stroke="#3d5a44" stroke-width="1"/>
        <circle cx="18" cy="21" r="4.5" fill="#f7d6c8"/>
        <text x="32" y="18" class="text-mono" font-size="9.5" font-weight="700" fill="#f7d6c8">ACTIVE STACK</text>
        <text x="32" y="32" font-size="11.5" font-weight="600" fill="#f4f1de">React, Next.js &amp; Laravel</text>
      </g>

      <!-- Pill 3: Education & Origin -->
      <g transform="translate(0, 52)">
        <rect width="206" height="42" rx="10" fill="#243328" stroke="#3d5a44" stroke-width="1"/>
        <circle cx="18" cy="21" r="4.5" fill="#ffeaa7"/>
        <text x="32" y="18" class="text-mono" font-size="9.5" font-weight="700" fill="#ffeaa7">ACADEMIC</text>
        <text x="32" y="32" font-size="11.5" font-weight="600" fill="#f4f1de">Information Systems (UTDI)</text>
      </g>

      <!-- Pill 4: Vision / Principle -->
      <g transform="translate(222, 52)">
        <rect width="206" height="42" rx="10" fill="#243328" stroke="#3d5a44" stroke-width="1"/>
        <circle cx="18" cy="21" r="4.5" fill="#c7efcf"/>
        <text x="32" y="18" class="text-mono" font-size="9.5" font-weight="700" fill="#c7efcf">PHILOSOPHY</text>
        <text x="32" y="32" font-size="11.5" font-weight="600" fill="#f4f1de">Technology as Amal Jariyah</text>
      </g>
    </g>

    <!-- Bottom Cozy Quote Box -->
    <g transform="translate(32, 248)">
      <rect width="428" height="64" rx="10" fill="#17241b" stroke="#344e41" stroke-width="1"/>
      <path d="M 0,0 L 4,0 L 4,64 L 0,64 Z" fill="#a3c9a8" rx="2"/>
      
      <text x="18" y="26" class="text-mono" font-size="10" font-weight="600" fill="#a3c9a8">
        NOTE // INTENTIONAL CRAFTSMANSHIP
      </text>
      <text x="18" y="46" class="text-sans" font-size="12" font-weight="500" fill="#f4f1de">
        Building thoughtful, accessible, and delightful digital products with care.
      </text>
    </g>
  </g>
</svg>