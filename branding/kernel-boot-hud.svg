<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 260" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="boot-bg" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#021406"/>
      <stop offset="65%" stop-color="#010903"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <!-- Scanline Pattern -->
    <pattern id="boot-scanlines" width="100" height="3" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-width="1" opacity="0.4"/>
    </pattern>

    <style>
      @keyframes type-row-1 { 0% { opacity: 0; } 5% { opacity: 1; } }
      @keyframes type-row-2 { 0%, 8% { opacity: 0; } 14% { opacity: 1; } }
      @keyframes type-row-3 { 0%, 17% { opacity: 0; } 23% { opacity: 1; } }
      @keyframes type-row-4 { 0%, 26% { opacity: 0; } 32% { opacity: 1; } }
      @keyframes type-row-5 { 0%, 35% { opacity: 0; } 41% { opacity: 1; } }
      @keyframes type-row-6 { 0%, 44% { opacity: 0; } 50% { opacity: 1; } }
      @keyframes type-row-7 { 0%, 53% { opacity: 0; } 59% { opacity: 1; } }
      @keyframes type-row-8 { 0%, 62% { opacity: 0; } 68% { opacity: 1; } }

      @keyframes led-blink {
        0%, 100% { opacity: 1; fill: #00ff41; }
        50% { opacity: 0.3; fill: #00ff41; }
      }

      @keyframes prompt-cursor {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }

      @keyframes pulse-frame {
        0%, 100% { stroke-opacity: 0.35; }
        50% { stroke-opacity: 0.85; }
      }

      .boot-font {
        font-family: 'Courier New', 'Fira Code', monospace;
      }
      .ts-tag {
        fill: #64748b;
      }
      .log-norm {
        fill: #e2e8f0;
      }
      .ok-badge {
        fill: #00ff41;
        font-weight: bold;
      }
      .alert-badge {
        fill: #00f2fe;
        font-weight: bold;
      }
      .r1 { animation: type-row-1 6s infinite; }
      .r2 { animation: type-row-2 6s infinite; }
      .r3 { animation: type-row-3 6s infinite; }
      .r4 { animation: type-row-4 6s infinite; }
      .r5 { animation: type-row-5 6s infinite; }
      .r6 { animation: type-row-6 6s infinite; }
      .r7 { animation: type-row-7 6s infinite; }
      .r8 { animation: type-row-8 6s infinite; }

      .boot-box {
        animation: pulse-frame 3s infinite;
      }
      .cursor {
        animation: prompt-cursor 0.8s step-start infinite;
      }
    </style>
  </defs>

  <!-- Monitor Frame -->
  <rect width="850" height="260" rx="10" fill="url(#boot-bg)" stroke="#00ff41" stroke-width="1.6" class="boot-box"/>

  <!-- Corner Brackets -->
  <g stroke="#00ff41" stroke-width="2" fill="none">
    <path d="M 12 28 L 12 12 L 28 12" />
    <path d="M 822 12 L 838 12 L 838 28" />
    <path d="M 12 232 L 12 248 L 28 248" />
    <path d="M 822 248 L 838 248 L 838 232" />
  </g>

  <!-- Header Tool Bar -->
  <g class="boot-font">
    <circle cx="26" cy="24" r="4" fill="#00ff41" style="animation: led-blink 1.5s infinite;"/>
    <text x="38" y="28" fill="#00ff41" font-size="11" font-weight="900">[TTY1 // KERNEL_INIT_STAGE_3]</text>
    <text x="610" y="28" fill="#00f2fe" font-size="10" font-weight="bold">dmesg -T --level=info,alert</text>
  </g>
  <line x1="16" y1="36" x2="834" y2="36" stroke="#00ff41" stroke-width="0.8" opacity="0.5"/>

  <!-- Boot Log Lines -->
  <g class="boot-font" font-size="10.8">
    <!-- Log 1 -->
    <g class="r1">
      <text x="24" y="58" class="ts-tag">[  0.000000]</text>
      <text x="120" y="58" class="log-norm">Linux version 7.2.2-1-cachyos (gcc-14.2.1) #1 SMP PREEMPT_DYNAMIC</text>
    </g>

    <!-- Log 2 -->
    <g class="r2">
      <text x="24" y="80" class="ts-tag">[  0.001420]</text>
      <text x="120" y="80" class="log-norm">CPU0: BORE (Burst-Oriented Response Enhancer) CPU Scheduler v5.4.3</text>
    </g>

    <!-- Log 3 -->
    <g class="r3">
      <text x="24" y="102" class="ts-tag">[  0.012040]</text>
      <text x="120" y="102" class="log-norm">Memory: 64GB DDR5 / Sub-Millisecond Quantum Access</text>
    </g>

    <!-- Log 4 -->
    <g class="r4">
      <text x="24" y="124" class="ts-tag">[  0.045100]</text>
      <text x="120" y="124" class="ok-badge">[OK]</text>
      <text x="155" y="124" class="log-norm">Initializing Zero-Trust Security Architecture (OWASP / AST)</text>
    </g>

    <!-- Log 5 -->
    <g class="r5">
      <text x="24" y="146" class="ts-tag">[  0.102450]</text>
      <text x="120" y="146" class="ok-badge">[OK]</text>
      <text x="155" y="146" class="log-norm">Mounted RuVector HNSW High-Dimensional Vector DB (150x Indexing)</text>
    </g>

    <!-- Log 6 -->
    <g class="r6">
      <text x="24" y="168" class="ts-tag">[  0.184200]</text>
      <text x="120" y="168" class="ok-badge">[OK]</text>
      <text x="155" y="168" class="log-norm">Synchronizing Islamic Fintech Engine &amp; Autonomous Akad Validator</text>
    </g>

    <!-- Log 7 -->
    <g class="r7">
      <text x="24" y="190" class="ts-tag">[  0.250100]</text>
      <text x="120" y="190" class="ok-badge">[OK]</text>
      <text x="155" y="190" class="log-norm">Connected 7 AI Nodes: Claude, GPT-4o, DeepSeek, Cursor, Kimi, Hermes, Antigravity</text>
    </g>

    <!-- Log 8 -->
    <g class="r8">
      <text x="24" y="212" class="ts-tag">[  0.301200]</text>
      <text x="120" y="212" class="alert-badge">[SYSTEM ALERT]</text>
      <text x="225" y="212" class="log-norm">All subsystems operational. User authenticated: <tspan fill="#00ff41" font-weight="bold">Arrafi Nur Hafiz (UID 0)</tspan></text>
    </g>
  </g>

  <!-- Bottom Interactive Cursor -->
  <line x1="16" y1="228" x2="834" y2="228" stroke="#00ff41" stroke-width="0.8" opacity="0.5"/>
  <g class="boot-font" font-size="10.5">
    <text x="24" y="246" fill="#00ff41" font-weight="bold">root@cachyos:~#</text>
    <rect x="145" y="236" width="7" height="12" fill="#00ff41" class="cursor"/>
    <text x="610" y="246" fill="#86efac">[SYSTEM STATE: PRODUCTION READY]</text>
  </g>

  <!-- CRT Scanlines -->
  <rect width="850" height="260" fill="url(#boot-scanlines)" pointer-events="none"/>
</svg>
