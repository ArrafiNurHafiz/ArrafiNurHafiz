<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 180" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="creed-bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#03160a"/>
      <stop offset="65%" stop-color="#020904"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <!-- Neon Glow Filter -->
    <filter id="arabic-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes holy-pulse {
        0%, 100% { fill-opacity: 0.9; filter: drop-shadow(0 0 4px #00ff41); }
        50% { fill-opacity: 1; filter: drop-shadow(0 0 12px #00ff66); }
      }
      @keyframes border-glow {
        0%, 100% { stroke-opacity: 0.4; stroke-dashoffset: 0; }
        50% { stroke-opacity: 0.9; stroke-dashoffset: -30; }
      }
      @keyframes geom-rotate {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes flicker-subtle {
        0%, 100% { opacity: 0.95; }
        50% { opacity: 0.8; }
      }

      .arabic-text {
        font-family: 'Amiri', 'Traditional Arabic', 'Scheherazade New', serif;
        font-size: 26px;
        font-weight: bold;
        fill: #00ff66;
        animation: holy-pulse 4s ease-in-out infinite;
      }
      .translation-text {
        font-family: 'Courier New', 'Fira Code', monospace;
        font-size: 13px;
        fill: #a7f3d0;
        letter-spacing: 1px;
      }
      .reference-text {
        font-family: 'Courier New', 'Fira Code', monospace;
        font-size: 11px;
        font-weight: 900;
        fill: #00ff41;
        letter-spacing: 2px;
      }
      .hud-creed-line {
        stroke: #00ff41;
        stroke-width: 1.2;
        stroke-dasharray: 6, 4;
        animation: border-glow 4s linear infinite;
      }
      .islamic-star {
        transform-origin: center;
        animation: geom-rotate 24s linear infinite;
      }
    </style>
  </defs>

  <!-- Frame Background -->
  <rect width="850" height="180" rx="12" fill="url(#creed-bg)" stroke="#00ff41" stroke-width="1.6" opacity="0.95"/>

  <!-- Corner Brackets -->
  <g stroke="#00ff41" stroke-width="2" fill="none">
    <path d="M 14 30 L 14 14 L 30 14" />
    <path d="M 820 14 L 836 14 L 836 30" />
    <path d="M 14 150 L 14 166 L 30 166" />
    <path d="M 820 166 L 836 166 L 836 150" />
  </g>

  <!-- Islamic Geometric Stars (Left & Right Anchors) -->
  <g transform="translate(60, 90)" stroke="#00ff41" stroke-width="1.2" fill="none" opacity="0.75">
    <rect x="-16" y="-16" width="32" height="32" class="islamic-star"/>
    <rect x="-16" y="-16" width="32" height="32" transform="rotate(45)" class="islamic-star"/>
    <circle cx="0" cy="0" r="3" fill="#00ff41"/>
  </g>

  <g transform="translate(790, 90)" stroke="#00ff41" stroke-width="1.2" fill="none" opacity="0.75">
    <rect x="-16" y="-16" width="32" height="32" class="islamic-star"/>
    <rect x="-16" y="-16" width="32" height="32" transform="rotate(45)" class="islamic-star"/>
    <circle cx="0" cy="0" r="3" fill="#00ff41"/>
  </g>

  <!-- Header Mini Label -->
  <text x="50%" y="28" text-anchor="middle" fill="#00ff41" font-family="'Courier New', monospace" font-size="10" font-weight="900" letter-spacing="3">[SACRED PROTOCOL // DIVINE PROVIDENCE]</text>
  <line x1="120" y1="36" x2="730" y2="36" class="hud-creed-line"/>

  <!-- Arabic Quran Verse -->
  <text x="50%" y="82" text-anchor="middle" class="arabic-text" filter="url(#arabic-glow)">
    وَمَا تَوْفِيقِي إِلَّا بِاللَّهِ ۚ عَلَيْهِ تَوَكَّلْتُ وَإِلَيْهِ أُنِيبُ
  </text>

  <!-- English Translation -->
  <text x="50%" y="122" text-anchor="middle" class="translation-text">
    "And my success is not but through Allah. Upon Him I have relied, and to Him I return."
  </text>

  <!-- Surah Reference -->
  <text x="50%" y="152" text-anchor="middle" class="reference-text">
    — SURAH HUD [11:88] • PRINCIPLE OF TAWAQQUL —
  </text>
</svg>
