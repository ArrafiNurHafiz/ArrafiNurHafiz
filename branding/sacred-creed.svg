<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 180" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Matcha & Cream Ambient) -->
    <radialGradient id="matcha-creed-bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#243328"/>
      <stop offset="70%" stop-color="#1b291f"/>
      <stop offset="100%" stop-color="#131e16"/>
    </radialGradient>

    <!-- Soft Glow Filter -->
    <filter id="soft-creed-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes soft-pulse {
        0%, 100% { opacity: 0.92; }
        50% { opacity: 1; filter: drop-shadow(0 0 6px #a3c9a8); }
      }
      @keyframes float-leaf {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(4deg); }
      }

      .text-arabic {
        font-family: 'Amiri', 'Traditional Arabic', 'Scheherazade New', serif;
        font-size: 26px;
        font-weight: bold;
        fill: #c7efcf;
        animation: soft-pulse 4s ease-in-out infinite;
      }
      .text-trans {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 13.5px;
        font-weight: 400;
        fill: #f4f1de;
      }
      .text-ref {
        font-family: 'JetBrains Mono', 'Fira Code', monospace;
        font-size: 11px;
        font-weight: 700;
        fill: #a3c9a8;
        letter-spacing: 2px;
      }
      .leaf-icon {
        transform-origin: center;
        animation: float-leaf 5s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Main Container -->
  <rect width="880" height="180" rx="16" fill="url(#matcha-creed-bg)" stroke="#3d5a44" stroke-width="1.4"/>

  <!-- Delicate Corner Accents (Botanical Leaf Stylized in SVG) -->
  <g stroke="#a3c9a8" stroke-width="1.4" fill="none">
    <path d="M 18 36 L 18 18 L 36 18" />
    <path d="M 844 18 L 862 18 L 862 36" />
    <path d="M 18 144 L 18 162 L 36 162" />
    <path d="M 844 162 L 862 162 L 862 144" />
  </g>

  <!-- Left Leaf Motif -->
  <g transform="translate(64, 90)" class="leaf-icon">
    <circle cx="0" cy="0" r="20" fill="#1b291f" stroke="#3d5a44" stroke-width="1"/>
    <path d="M -8,8 Q -10,-8 0,-12 Q 10,-8 8,8 Q 0,12 -8,8 Z" fill="#7fa073"/>
    <line x1="0" y1="-8" x2="0" y2="8" stroke="#f4f1de" stroke-width="0.8"/>
  </g>

  <!-- Right Leaf Motif -->
  <g transform="translate(816, 90)" class="leaf-icon">
    <circle cx="0" cy="0" r="20" fill="#1b291f" stroke="#3d5a44" stroke-width="1"/>
    <path d="M -8,8 Q -10,-8 0,-12 Q 10,-8 8,8 Q 0,12 -8,8 Z" fill="#7fa073"/>
    <line x1="0" y1="-8" x2="0" y2="8" stroke="#f4f1de" stroke-width="0.8"/>
  </g>

  <!-- Top Pill Tag -->
  <g transform="translate(340, 16)">
    <rect width="200" height="22" rx="11" fill="#1b291f" stroke="#3d5a44" stroke-width="1"/>
    <text x="100" y="15" class="text-ref" text-anchor="middle" font-size="10" letter-spacing="1">
      SPIRITUAL ROOT
    </text>
  </g>

  <!-- Arabic Calligraphy -->
  <text x="50%" y="82" text-anchor="middle" class="text-arabic" filter="url(#soft-creed-glow)">
    وَمَا تَوْفِيقِي إِلَّا بِاللَّهِ ۚ عَلَيْهِ تَوَكَّلْتُ وَإِلَيْهِ أُنِيبُ
  </text>

  <!-- Translation -->
  <text x="50%" y="120" text-anchor="middle" class="text-trans">
    "And my success is not but through Allah. Upon Him I have relied, and to Him I return."
  </text>

  <!-- Surah Reference -->
  <text x="50%" y="150" text-anchor="middle" class="text-ref">
    SURAH HUD [11:88] -- INTENTION: AMAL JARIYAH
  </text>
</svg>