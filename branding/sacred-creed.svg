<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 180" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="matcha-creed-bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#243328"/>
      <stop offset="70%" stop-color="#1b291f"/>
      <stop offset="100%" stop-color="#121d15"/>
    </radialGradient>

    <!-- Soft Glow Filter -->
    <filter id="soft-creed-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
        0%, 100% { opacity: 0.92; filter: drop-shadow(0 0 4px #a3c9a8); }
        50% { opacity: 1; filter: drop-shadow(0 0 10px #c7efcf); }
      }
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(6deg); }
      }
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -40; }
      }

      .text-arabic {
        font-family: 'Amiri', 'Traditional Arabic', 'Scheherazade New', serif;
        font-size: 26px;
        font-weight: bold;
        fill: #c7efcf;
        
      }
      .text-trans {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 13.5px;
        font-weight: 400;
        fill: #f4f1de;
      }
      .text-ref {
        font-family: 'JetBrains Mono', 'Fira Code', monospace;
        font-size: 11px;
        font-weight: 700;
        fill: #a3c9a8;
        letter-spacing: 2px;
      }
      .leaf-icon-left {
        
      }
      .leaf-icon-right {
        
      }
      .creed-border-anim {
        stroke-dasharray: 8 6;
        
      }
    </style>
  </defs>

  <!-- Main Container -->
  <rect width="880" height="180" rx="16" fill="url(#matcha-creed-bg)" stroke="#3d5a44" stroke-width="1.4"/>
  <rect width="880" height="180" rx="16" fill="none" stroke="#a3c9a8" stroke-width="1.2" opacity="0.6"/>

  <!-- Left Leaf Motif -->
  <g>
    <circle cx="64" cy="90" r="20" fill="#1b291f" stroke="#3d5a44" stroke-width="1"/>
    <path d="M 56,98 Q 54,82 64,78 Q 74,82 72,98 Q 64,102 56,98 Z" fill="#7fa073"/>
    <line x1="64" y1="82" x2="64" y2="98" stroke="#f4f1de" stroke-width="0.8"/>
  </g>

  <!-- Right Leaf Motif -->
  <g>
    <circle cx="816" cy="90" r="20" fill="#1b291f" stroke="#3d5a44" stroke-width="1"/>
    <path d="M 808,98 Q 806,82 816,78 Q 826,82 824,98 Q 816,102 808,98 Z" fill="#7fa073"/>
    <line x1="816" y1="82" x2="816" y2="98" stroke="#f4f1de" stroke-width="0.8"/>
  </g>

  <!-- Top Pill Tag -->
  <g transform="translate(340, 16)">
    <rect width="200" height="22" rx="11" fill="#1b291f" stroke="#3d5a44" stroke-width="1"/>
    <text x="100" y="15" class="text-ref" text-anchor="middle" font-size="10" letter-spacing="1">
      SPIRITUAL ROOT
    </text>
  </g>

  <!-- Arabic Calligraphy -->
  <text x="50%" y="82" text-anchor="middle" class="text-arabic" filter="url(#soft-creed-glow)">
    وَمَا تَوْفِيقِي إِلَّا بِاللَّهِ ۚ عَلَيْهِ تَوَكَّلْتُ وَإِلَيْهِ أُنِيبُ
  </text>

  <!-- Translation -->
  <text x="50%" y="120" text-anchor="middle" class="text-trans">
    "And my success is not but through Allah. Upon Him I have relied, and to Him I return."
  </text>

  <!-- Surah Reference -->
  <text x="50%" y="150" text-anchor="middle" class="text-ref">
    SURAH HUD [11:88] -- INTENTION: AMAL JARIYAH
  </text>
</svg>